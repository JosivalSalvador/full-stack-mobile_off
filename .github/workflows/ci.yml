name: CI

on:
  push:
    branches:
      - dev

jobs:
  analyze_and_test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up Flutter (version from .fvmrc)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate code (Drift/Riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Show coverage summary
        run: lcov --list coverage/lcov.info

  auto_create_pr:
    name: Create Pull Request to main
    needs: analyze_and_test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Create Pull Request via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --head dev --base main --state open --json number -q '.[0].number')
          
          if [ -z "$EXISTING_PR" ]; then
            echo "Criando novo PR..."
            gh pr create \
              --head dev \
              --base main \
              --title "ci(auto): merge dev into main" \
              --body "## Automated Pull Request
          This PR was automatically created by the CI workflow after all tests and checks passed on \`dev\`."
          else
            echo "Já existe um PR aberto (#$EXISTING_PR) de dev para main."
          fi