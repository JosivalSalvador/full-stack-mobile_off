name: CI

on:
  push:
    branches:
      - dev

jobs:
  analyze_and_test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up Flutter (version from .fvmrc)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate code (Drift/Riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Report and enforce coverage
        run: |
          sudo apt-get install -y lcov
          
          # Remove arquivos gerados e de localizacao do relatorio
          lcov --remove coverage/lcov.info '**/*.g.dart' '**/l10n/*.dart' -o coverage/lcov_filtered.info

          # Escreve a tabela no resumo oficial do job (GitHub Job Summary)
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "| File | Coverage | Uncovered Lines |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY

          awk -F':' '
            /^SF:/ { file = $2 }
            /^DA:/ {
              split($2, data, ","); line = data[1]; hits = data[2];
              total_lines[file]++;
              if (hits == 0) {
                uncovered[file] = uncovered[file] (uncovered[file] ? ", " : "") line;
              } else {
                covered[file]++;
              }
            }
            END {
              tot_lines = 0; tot_cov = 0;
              for (f in total_lines) {
                pct = (covered[f] / total_lines[f]) * 100;
                tot_lines += total_lines[f];
                tot_cov += covered[f];
                miss = uncovered[f] ? uncovered[f] : "-";
                printf "| `%s` | %.1f%% | %s |\n", f, pct, miss >> "'$GITHUB_STEP_SUMMARY'";
              }
              if (tot_lines > 0) {
                total_pct = (tot_cov / tot_lines) * 100;
                printf "\n**Total Coverage: %.2f%%**\n", total_pct >> "'$GITHUB_STEP_SUMMARY'";
                
                # Altere 0 para a porcentagem minima desejada (ex: 80)
                MIN_COV=80
                if (total_pct < MIN_COV) {
                  printf "Coverage (%.2f%%) is below minimum threshold (%d%%)\n", total_pct, MIN_COV;
                  exit 1;
                }
              }
            }
          ' coverage/lcov_filtered.info

  auto_create_pr:
    name: Create Pull Request to main
    needs: analyze_and_test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Create Pull Request via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --head dev --base main --state open --json number -q '.[0].number')
          
          if [ -z "$EXISTING_PR" ]; then
            echo "Criando novo PR..."
            gh pr create \
              --head dev \
              --base main \
              --title "ci(auto): merge dev into main" \
              --body "## Automated Pull Request
          This PR was automatically created by the CI workflow after all tests and checks passed on \`dev\`."
          else
            echo "Já existe um PR aberto (#$EXISTING_PR) de dev para main."
          fi