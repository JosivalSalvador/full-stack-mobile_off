name: keymory_off
description: "A local, offline-first password manager."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cryptography: ^2.9.0
  cupertino_icons: ^1.0.8
  drift: ^2.34.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  flutter_validators: ^1.2.0
  go_router: ^17.3.0
  intl: ^0.20.2
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ^5.6.4
  riverpod_generator: ^4.0.4
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true

  # Generates localization code from the .arb files in lib/l10n/.
  generate: true

  assets:
    - assets/icons/
    - assets/images/